services:

  postgres:
    image: postgres:17-alpine
    container_name: tielearn-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tielearn -d tielearn_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4
    container_name: tielearn-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin


  backend:
    image: tielearn-backend:latest

    build:
      context: ./BACKEND

    container_name: tielearn-backend
    restart: unless-stopped

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    image: tielearn-frontend:latest

    build:
      context: ./tielearn-web-app-master
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api

    container_name: tielearn-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - backend


volumes:
  postgres_data:
  pgadmin_data:
